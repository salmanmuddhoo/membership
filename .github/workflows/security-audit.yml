name: Security Audit

# The Security Audit Agent required by FRD Section 30.
#
# Runs automatically on every pull request into a protected branch — no
# developer action needed — and covers the four areas the FRD names:
#   * SAST                    -> Semgrep
#   * Dependency analysis     -> pnpm audit (primary) + Trivy (second opinion)
#   * Secrets scanning        -> Gitleaks
#   * Misconfiguration checks -> Trivy config
#
# Merge-blocking thresholds are configurable here (FRD 30.2). High/Critical
# block; Medium/Low are reported for the backlog rather than blocking.
on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  schedule:
    # Weekly re-scan so newly disclosed advisories surface even with no commits.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # --- Merge gate thresholds (FRD 30.2) -----------------------------------
  # pnpm audit: low | moderate | high | critical
  AUDIT_BLOCK_LEVEL: high
  # Trivy severities that fail the build
  TRIVY_BLOCK_SEVERITY: HIGH,CRITICAL
  # Semgrep: ERROR fails the build; WARNING and INFO are reported only
  SEMGREP_BLOCK_SEVERITY: ERROR

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is
          # still leaked, so scanning only the tip is not sufficient.
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --exit-code=1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 90

  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep (blocking rules)
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --severity=${{ env.SEMGREP_BLOCK_SEVERITY }} \
            --metrics=off \
            --error \
            --sarif --output=semgrep.sarif

      - name: Semgrep (informational — never blocks)
        if: always()
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --severity=WARNING \
            --metrics=off \
            --json --output=semgrep-warnings.json || true
          echo "Informational findings recorded for the backlog (FRD 30.2)."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep-warnings.json
          if-no-files-found: ignore
          retention-days: 90

  dependencies:
    name: Dependency analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (blocking at ${{ env.AUDIT_BLOCK_LEVEL }} and above)
        run: pnpm audit --audit-level=${{ env.AUDIT_BLOCK_LEVEL }}

      - name: Full advisory report (never blocks)
        if: always()
        run: pnpm audit --json > pnpm-audit.json || true

      - name: Trivy — vulnerabilities (second opinion)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/aquasecurity/trivy:latest \
            fs --scanners vuln \
               --severity ${{ env.TRIVY_BLOCK_SEVERITY }} \
               --exit-code 1 \
               --no-progress \
               .

      - name: Trivy — misconfiguration (reported, not blocking)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/aquasecurity/trivy:latest \
            fs --scanners misconfig \
               --exit-code 0 \
               --no-progress \
               . | tee trivy-misconfig.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            pnpm-audit.json
            trivy-misconfig.txt
          if-no-files-found: ignore
          retention-days: 90

  audit-record:
    name: Audit record
    runs-on: ubuntu-latest
    needs: [secrets, sast, dependencies]
    if: always()
    steps:
      - name: Write run summary
        run: |
          {
            echo "## Security Audit — result"
            echo ""
            echo "| Check | Tool | Result |"
            echo "| --- | --- | --- |"
            echo "| Secrets | Gitleaks | ${{ needs.secrets.result }} |"
            echo "| Static analysis (SAST) | Semgrep | ${{ needs.sast.result }} |"
            echo "| Dependencies (SCA) | pnpm audit + Trivy | ${{ needs.dependencies.result }} |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Blocking thresholds — audit: \`${{ env.AUDIT_BLOCK_LEVEL }}\`, Trivy: \`${{ env.TRIVY_BLOCK_SEVERITY }}\`, Semgrep: \`${{ env.SEMGREP_BLOCK_SEVERITY }}\`"
            echo ""
            echo "Full reports are attached to this run as artifacts (retained 90 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: needs.secrets.result != 'success' || needs.sast.result != 'success' || needs.dependencies.result != 'success'
        run: |
          echo "::error::Security Audit failed — merge is blocked (FRD 30.2)."
          exit 1
