# Dependabot keeps dependencies and workflow actions patched. Its pull requests
# pass through the same security gate as any other change.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Prettier bumps often reformat the repo; group them so a single
      # formatting pass covers the whole change.
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'

  # The security gate is only as current as the actions it runs.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
